<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <p-card header="Register" styleClass="w-full max-w-md shadow-lg">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="p-fluid">
      <div class="field mb-4">
        <span class="p-float-label">
          <input id="username" type="text" pInputText formControlName="username" />
          <label for="username">Username</label>
        </span>
        <small *ngIf="username?.invalid && (username?.dirty || username?.touched)" class="p-error">
          <div *ngIf="username?.errors?.['required']">Username is required</div>
          <div *ngIf="username?.errors?.['minlength']">Username must be at least 3 characters</div>
        </small>
      </div>

      <div class="field mb-4">
        <span class="p-float-label">
          <input id="email" type="email" pInputText formControlName="email" />
          <label for="email">Email</label>
        </span>
        <small *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="p-error">
          <div *ngIf="email?.errors?.['required']">Email is required</div>
          <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
        </small>
      </div>

      <div class="field mb-4">
        <span class="p-float-label">
          <p-password id="password" formControlName="password" [toggleMask]="true"></p-password>
          <label for="password">Password</label>
        </span>
        <small *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="p-error">
          <div *ngIf="password?.errors?.['required']">Password is required</div>
          <div *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</div>
        </small>
      </div>

      <div class="field mb-4">
        <span class="p-float-label">
          <p-password id="confirmPassword" formControlName="confirmPassword" [feedback]="false" [toggleMask]="true"></p-password>
          <label for="confirmPassword">Confirm Password</label>
        </span>
        <small *ngIf="confirmPassword?.invalid && (confirmPassword?.dirty || confirmPassword?.touched)" class="p-error">
          <div *ngIf="confirmPassword?.errors?.['required']">Confirm Password is required</div>
        </small>
        <small *ngIf="registerForm.errors?.['passwordMismatch']" class="p-error">
          Passwords do not match
        </small>
      </div>

      <div class="flex justify-between items-center mb-4">
        <p-button type="submit" label="Register" [disabled]="registerForm.invalid || isLoading"></p-button>
        <a routerLink="/login" class="text-blue-500 hover:underline">Already have an account?</a>
      </div>
    </form>

    <div *ngIf="isLoading" class="flex justify-center">
      <p-progressSpinner></p-progressSpinner>
    </div>
  </p-card>
</div>

<p-toast></p-toast>
