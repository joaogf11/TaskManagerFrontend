<div class="flex justify-center items-center min-h-screen bg-gray-50 p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-lg p-6 md:p-8">
      <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">Login</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div class="space-y-1">
          <span class="p-float-label w-full">
            <input id="email" type="email" pInputText formControlName="email" class="w-full" />
            <label for="email">Email</label>
          </span>
          <small *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="p-error text-sm">
            <div *ngIf="email?.errors?.['required']">Email is required</div>
            <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
          </small>
        </div>

        <div class="space-y-1">
          <span class="p-float-label w-full">
            <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" styleClass="w-full"></p-password>
            <label for="password">Password</label>
          </span>
          <small *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="p-error text-sm">
            <div *ngIf="password?.errors?.['required']">Password is required</div>
          </small>
        </div>

        <div class="pt-2">
          <button pButton type="submit" label="Login" class="w-full p-button-primary" [disabled]="loginForm.invalid || isLoading"></button>
        </div>
        
        <div class="text-center pt-2">
          <a routerLink="/register" class="text-blue-600 hover:text-blue-800 text-sm">Don't have an account?</a>
        </div>
      </form>

      <div *ngIf="isLoading" class="flex justify-center mt-4">
        <p-progressSpinner [style]="{width: '50px', height: '50px'}"></p-progressSpinner>
      </div>
    </div>
  </div>
</div>

<p-toast></p-toast>
