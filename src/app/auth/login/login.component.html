<div class="flex justify-center items-center min-h-screen bg-gray-100">
  <p-card header="Login" styleClass="w-full max-w-md shadow-lg">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="p-fluid">
      <div class="field mb-4">
        <span class="p-float-label">
          <input id="email" type="email" pInputText formControlName="email" />
          <label for="email">Email</label>
        </span>
        <small *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="p-error">
          <div *ngIf="email?.errors?.['required']">Email is required</div>
          <div *ngIf="email?.errors?.['email']">Please enter a valid email address</div>
        </small>
      </div>

      <div class="field mb-4">
        <span class="p-float-label">
          <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true"></p-password>
          <label for="password">Password</label>
        </span>
        <small *ngIf="password?.invalid && (password?.dirty || password?.touched)" class="p-error">
          <div *ngIf="password?.errors?.['required']">Password is required</div>
        </small>
      </div>

      <div class="flex justify-between items-center mb-4">
        <p-button type="submit" label="Login" [disabled]="loginForm.invalid || isLoading"></p-button>
        <a routerLink="/register" class="text-blue-500 hover:underline">Don't have an account?</a>
      </div>
    </form>

    <div *ngIf="isLoading" class="flex justify-center">
      <p-progressSpinner></p-progressSpinner>
    </div>
  </p-card>
</div>

<p-toast></p-toast>
