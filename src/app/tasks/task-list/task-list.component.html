<!-- Lista de cards de tarefas -->
<div *ngIf="!isLoading && tasks.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
  <div *ngFor="let task of tasks" class="task-card bg-surface-card rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 p-5">
    <div class="flex justify-between mb-3">
      <span [ngClass]="{
        'bg-red-100 text-red-700': task.priority === 2,
        'bg-amber-100 text-amber-700': task.priority === 1,
        'bg-blue-100 text-blue-700': task.priority === 0
      }" class="text-xs font-medium py-1 px-2.5 rounded-full">
        {{ getPriorityLabel(task.priority) }}
      </span>
      <p-tag 
        [value]="task.isCompleted ? 'Concluída' : 'Pendente'" 
        [severity]="task.isCompleted ? 'success' : 'warning'">
      </p-tag>
    </div>
    
    <h3 class="text-lg font-semibold mb-2" [class.line-through]="task.isCompleted" [class.text-gray-500]="task.isCompleted">
      {{ task.title }}
    </h3>
    
    <p *ngIf="task.description" class="text-gray-600 mb-4 text-sm line-clamp-3">
      {{ task.description }}
    </p>
    
    <div *ngIf="task.dueDate" class="flex items-center mb-4 text-gray-500 text-sm">
      <i class="pi pi-calendar mr-2"></i>
      <span>{{ task.dueDate | date:'longDate' }}</span>
    </div>
    
    <!-- Improved task card footer with better action buttons -->
    <div class="flex justify-between items-center pt-3 mt-2 border-t border-gray-100">
      <div class="flex gap-2">
        <button 
          pButton 
          icon="pi pi-check" 
          class="p-button-rounded p-button-success p-button-sm" 
          *ngIf="!task.isCompleted"
          pTooltip="Marcar como concluída"
          (click)="markAsCompleted(task)">
        </button>
        <button 
          pButton 
          icon="pi pi-pencil" 
          class="p-button-rounded p-button-primary p-button-sm" 
          pTooltip="Editar tarefa"
          (click)="editTask(task)">
        </button>
        <button 
          pButton 
          icon="pi pi-trash" 
          class="p-button-rounded p-button-danger p-button-sm" 
          pTooltip="Excluir tarefa"
          (click)="confirmDelete(task)">
        </button>
      </div>
      <span *ngIf="task.isCompleted" class="flex items-center gap-1 text-green-600 text-xs font-medium">
        <i class="pi pi-check-circle"></i>
        Concluída
      </span>
    </div>
  </div>
</div>
