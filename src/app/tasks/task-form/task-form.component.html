<!-- task-form.component.html - Modern Style -->
<form
  [formGroup]="taskForm"
  (ngSubmit)="saveTask()"
  class="p-fluid bg-white rounded-xl shadow-lg p-6 space-y-5 border border-gray-100"
>
  <!-- Title Field -->
  <div class="form-field">
    <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Título</label>
    <div class="relative rounded-lg shadow-sm">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="pi pi-bookmark text-gray-400"></i>
      </div>
      <input 
        id="title" 
        type="text" 
        pInputText 
        formControlName="title" 
        placeholder="Digite o título da tarefa" 
        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150 ease-in-out"
      />
    </div>
    <small *ngIf="title?.invalid && (title?.dirty || title?.touched)" class="text-red-600 text-xs block mt-1">
      <span *ngIf="title?.errors?.['required']">Título é obrigatório.</span>
      <span *ngIf="title?.errors?.['minlength']">Título deve ter pelo menos 3 caracteres.</span>
    </small>
  </div>

  <!-- Description Field -->
  <div class="form-field">
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descrição (Opcional)</label>
    <div class="relative rounded-lg shadow-sm">
       <div class="absolute top-2.5 left-0 pl-3 flex items-center pointer-events-none">
         <i class="pi pi-align-left text-gray-400"></i>
       </div>
      <textarea 
        id="description" 
        pInputTextarea 
        formControlName="description" 
        rows="3" 
        placeholder="Adicione detalhes sobre a tarefa"
        class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition duration-150 ease-in-out"
      ></textarea>
    </div>
  </div>

  <!-- Priority and Due Date Fields -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="form-field">
      <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
      <p-dropdown 
        id="priority" 
        [options]="priorityOptions" 
        formControlName="priority" 
        optionLabel="label" 
        optionValue="value" 
        placeholder="Selecione a prioridade"
        styleClass="w-full p-dropdown-modern rounded-lg shadow-sm"
      ></p-dropdown>
    </div>

    <div class="form-field">
      <label for="dueDate" class="block text-sm font-medium text-gray-700 mb-1">Data de Vencimento (Opcional)</label>
      <p-calendar 
        id="dueDate" 
        formControlName="dueDate" 
        [showIcon]="true" 
        iconDisplay="input"
        [showButtonBar]="true" 
        dateFormat="dd/mm/yy" 
        placeholder="Selecione a data"
        styleClass="w-full p-calendar-modern rounded-lg shadow-sm"
        [baseZIndex]="9999"
      ></p-calendar>
    </div>
  </div>

  <!-- Completed Checkbox (Only in Edit Mode) -->
  <div *ngIf="editMode" class="form-field pt-2">
    <div class="flex items-center justify-between p-4 rounded-lg bg-gray-50 border border-gray-200">
      <div class="flex items-center">
        <p-checkbox formControlName="isCompleted" [binary]="true" inputId="isCompleted"></p-checkbox>
        <label for="isCompleted" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer">Marcar como concluída</label>
      </div>
      <button 
        type="button" 
        pButton 
        pRipple
        icon="pi pi-check-circle" 
        [class.text-green-600]="taskForm.get('isCompleted')?.value"
        [class.text-gray-400]="!taskForm.get('isCompleted')?.value"
        class="p-button-rounded p-button-text"
        pTooltip="Alternar status da tarefa" 
        tooltipPosition="left"
        (click)="toggleTaskCompletion()"
      ></button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="flex justify-end gap-3 pt-5 border-t border-gray-100 mt-4">
    <button
      pButton
      pRipple
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      (click)="cancel()"
      class="p-button-text text-gray-600 hover:bg-gray-100"
    ></button>
    <button
      pButton
      pRipple
      type="submit"
      [label]="editMode ? 'Atualizar Tarefa' : 'Criar Tarefa'"
      icon="pi pi-save"
      class="p-button-primary bg-teal-600 hover:bg-teal-700 border-teal-600 hover:border-teal-700 text-white font-semibold py-2 px-4 rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 ease-in-out"
      [disabled]="taskForm.invalid"
    ></button>
  </div>
</form>
