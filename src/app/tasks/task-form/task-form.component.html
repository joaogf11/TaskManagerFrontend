<form
  [formGroup]="taskForm"
  (ngSubmit)="saveTask()"
  class="p-fluid bg-white rounded-xl shadow-md p-6 space-y-5"
>
  <div class="form-field">
    <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Título</label>
    <div class="p-input-icon-left w-full">
      <i class="pi pi-bookmark"></i>
      <input 
        id="title" 
        type="text" 
        pInputText 
        formControlName="title" 
        placeholder="Digite o título da tarefa" 
        class="w-full rounded-lg" 
      />
    </div>
    <small *ngIf="title?.invalid && (title?.dirty || title?.touched)" class="p-error text-sm block mt-1">
      <div *ngIf="title?.errors?.['required']">Título é obrigatório</div>
      <div *ngIf="title?.errors?.['minlength']">Título deve ter pelo menos 3 caracteres</div>
    </small>
  </div>

  <div class="form-field">
    <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Descrição</label>
    <div class="p-input-icon-left w-full">
      <i class="pi pi-align-left"></i>
      <textarea 
        id="description" 
        pInputTextarea 
        formControlName="description" 
        rows="3" 
        placeholder="Digite a descrição da tarefa"
        class="w-full rounded-lg pl-10"
      ></textarea>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="form-field">
      <label for="priority" class="block text-sm font-medium text-gray-700 mb-1">Prioridade</label>
      <p-dropdown 
        id="priority" 
        [options]="priorityOptions" 
        formControlName="priority" 
        optionLabel="label" 
        optionValue="value" 
        placeholder="Selecione a prioridade"
        [styleClass]="'w-full rounded-lg'"
      ></p-dropdown>
    </div>

    <div class="form-field">
      <label for="dueDate" class="block text-sm font-medium text-gray-700 mb-1">Data de Vencimento</label>
      <p-calendar 
        id="dueDate" 
        formControlName="dueDate" 
        [showIcon]="true" 
        [showButtonBar]="true" 
        dateFormat="dd/mm/yy" 
        placeholder="Selecione a data"
        styleClass="w-full"
        [inputStyleClass]="'rounded-lg'"
      ></p-calendar>
    </div>
  </div>

  <div *ngIf="editMode" class="form-field pt-2">
    <div class="flex items-center p-3 rounded-lg bg-gray-50">
      <p-checkbox formControlName="isCompleted" [binary]="true" inputId="isCompleted"></p-checkbox>
      <label for="isCompleted" class="ml-2 text-gray-700">Marcar como concluída</label>
    </div>
  </div>

  <div class="flex justify-end gap-3 pt-5 border-t border-gray-100 mt-4">
    <p-button
      type="button"
      label="Cancelar"
      icon="pi pi-times"
      (onClick)="cancel()"
      styleClass="p-button-text"
    ></p-button>
    <p-button
      type="submit"
      label="Salvar"
      icon="pi pi-save"
      styleClass="p-button-primary"
      [disabled]="taskForm.invalid"
    ></p-button>
  </div>
</form>
